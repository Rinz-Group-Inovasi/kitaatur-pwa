name: Auto Deploy KitaAtur

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/kitaatur/kitaatur-pwa/backend 2>/dev/null || cd /var/www/kitaatur/backend
            git pull origin main
            npm install
            chmod -R +x node_modules/.bin
            npx prisma generate
            npm run build
            pm2 restart kitaatur-backend || pm2 restart kitaatur
